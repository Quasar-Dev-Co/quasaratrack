<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quasara Track</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- ============= AUTH SCREEN (Login / Signup) ============= -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon"><img src="icons/icon-48.png" alt="Quasara" /></span>
        <span class="logo-text">Quasara Track</span>
      </div>
    </div>

    <div class="auth-card">
      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-auth-tab="login">Sign In</button>
        <button class="auth-tab-btn" data-auth-tab="signup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active">
        <div class="auth-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="auth-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <div id="login-error" class="auth-error" style="display:none;"></div>
        <button type="submit" id="login-submit" class="auth-submit-btn">
          Sign In
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form">
        <div class="auth-field">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="John Doe" required />
        </div>
        <div class="auth-field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required />
        </div>
        <div class="auth-field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" required />
        </div>
        <div id="signup-error" class="auth-error" style="display:none;"></div>
        <button type="submit" id="signup-submit" class="auth-submit-btn">
          Create Account
        </button>
      </form>
    </div>

    <p class="auth-footer">Quasara Track · Employee Productivity</p>
  </div>

  <!-- ============= MAIN APP (shown after login) ============= -->
  <div id="main-app" style="display:none;">

    <div class="header">
      <div class="logo">
        <span class="logo-icon"><img src="icons/icon-48.png" alt="Quasara" /></span>
        <span class="logo-text">Quasara Track</span>
      </div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span id="header-status-text">Tracking</span>
      </div>
    </div>

    <!-- User bar -->
    <div class="user-bar">
      <div class="user-avatar" id="user-avatar">U</div>
      <div class="user-info">
        <div class="user-name" id="user-name">User</div>
        <div class="user-email" id="user-email">user@example.com</div>
      </div>
      <button id="logout-btn" class="logout-btn" title="Sign Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="today">Today</button>
    </div>

    <!-- TODAY TAB -->
    <div id="today-tab" class="tab-content active">
      <div class="today-header">
        <div id="today-date" class="today-date">Today</div>
        <div id="synced-badge" class="synced-badge synced-no" style="display:none;">Not synced yet</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Active Time</div>
          <div class="stat-value" id="stat-active">0s</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Inactive Time</div>
          <div class="stat-value" id="stat-inactive">0s</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Keystrokes</div>
          <div class="stat-value" id="stat-keystrokes">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Clicks</div>
          <div class="stat-value" id="stat-clicks">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Copies / Pastes</div>
          <div class="stat-value" id="stat-cp">0 / 0</div>
        </div>
      </div>

      <div class="section-title-row">
        <div class="section-title">Tabs Used Today</div>
        <span id="tab-count" class="tab-count-badge"></span>
      </div>
      <div id="tab-list" class="tab-list">
        <div class="empty-state">No tabs tracked yet today.</div>
      </div>

      <div id="ai-summary-section" class="ai-summary-section" style="display:none;">
        <div class="section-title">AI Daily Summary</div>
        <div id="ai-summary-text" class="ai-summary-text"></div>
      </div>

      <div class="sync-section">
        <button id="sync-btn" class="sync-btn">
          <span class="sync-icon">&#x21bb;</span> Generate Summary &amp; Sync
        </button>
        <div id="sync-status" class="sync-status"></div>
      </div>
    </div>

  </div><!-- /main-app -->

  <!-- bcryptjs for password hashing (needed in popup for signup) -->
  <script src="lib/bcryptjs.min.js"></script>
  <!-- Auth + settings + popup logic -->
  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
